name: Check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # React Native Testing Library 14 needs Node 22.13 or newer
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
